name: Daily Update

on:
  schedule:
    - cron: "0 4 * * *" # 4 AM UTC daily
  workflow_dispatch:
    inputs:
      stage:
        description: "Run a specific stage instead of the daily tier"
        required: false
        type: string

permissions:
  contents: read
  actions: write
  issues: write

env:
  PYTHON_VERSION: "3.12"
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
  CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
  CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
  GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: civic-cache-db
          path: data/
        continue-on-error: true # First run won't have an artifact

      - name: Build database if missing
        run: |
          if [ ! -f data/civic_cache.db ]; then
            echo "No existing database -- running build_database.py"
            python3 scripts/build_database.py
          fi

      - name: Run pipeline
        id: pipeline
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            python3 scripts/update.py --stage "${{ inputs.stage }}" --json | tee pipeline-output.json
          else
            python3 scripts/update.py daily --json | tee pipeline-output.json
          fi

      - name: Optimize database
        run: sqlite3 data/civic_cache.db "VACUUM; ANALYZE;"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: civic-cache-db
          path: data/civic_cache.db
          retention-days: 30
          overwrite: true

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: daily-update #${context.runNumber}`,
              body: `The daily pipeline failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['pipeline-failure']
            });

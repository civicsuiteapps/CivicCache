name: Full Rebuild

on:
  workflow_dispatch:
    inputs:
      include_fec:
        description: "Download and import FEC bulk data"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  PYTHON_VERSION: "3.12"
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
  CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
  CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
  GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build fresh database schema
        run: python3 scripts/build_database.py --fresh --schema-only

      - name: Download FEC bulk data
        if: ${{ inputs.include_fec }}
        run: python3 scripts/download_fec_bulk.py --cycles 2024,2026

      - name: Run full pipeline
        run: python3 scripts/update.py full --json | tee pipeline-output.json

      - name: Health check
        run: python3 scripts/update.py --check --json

      - name: Optimize database
        run: sqlite3 data/civic_cache.db "VACUUM; ANALYZE;"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: civic-cache-db
          path: data/civic_cache.db
          retention-days: 90
          overwrite: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: full-rebuild-${{ github.run_number }}
          name: "Full rebuild #${{ github.run_number }}"
          body: "Full database rebuild from scratch."
          files: data/civic_cache.db

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: full-rebuild #${context.runNumber}`,
              body: `The full rebuild failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['pipeline-failure']
            });

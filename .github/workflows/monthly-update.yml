name: Monthly Update

on:
  schedule:
    - cron: "0 1 1 * *" # 1st of month, 1 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

env:
  PYTHON_VERSION: "3.12"
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
  CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
  CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
  GOVINFO_API_KEY: ${{ secrets.GOVINFO_API_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: civic-cache-db
          path: data/
        continue-on-error: true

      - name: Build database if missing
        run: |
          if [ ! -f data/civic_cache.db ]; then
            echo "No existing database -- running build_database.py"
            python3 scripts/build_database.py
          fi

      - name: Run pipeline
        run: python3 scripts/update.py monthly --json | tee pipeline-output.json

      - name: Optimize database
        run: sqlite3 data/civic_cache.db "VACUUM; ANALYZE;"

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: civic-cache-db
          path: data/civic_cache.db
          retention-days: 90
          overwrite: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monthly-v${{ github.run_number }}
          name: "Monthly data update v${{ github.run_number }}"
          body: "Automated monthly data pipeline run."
          files: data/civic_cache.db

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline failure: monthly-update #${context.runNumber}`,
              body: `The monthly pipeline failed.\n\n[View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['pipeline-failure']
            });
